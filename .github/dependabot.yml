version: 2
updates:
  # npm updates use the pinned pnpm version manually; see docs/maintenance.md.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-maintenance:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
