name: Preserve verified archive snapshot

on:
  push:
    tags: ['archive-*']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:pages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Create verified snapshot
        run: pnpm snapshot
        env:
          SNAPSHOT_NAME: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: static-archive-snapshot
          path: dist/snapshots/${{ github.ref_name }}/
          retention-days: 7

  release:
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: static-archive-snapshot
          path: snapshot
      - name: Verify release files
        working-directory: snapshot
        run: sha256sum --check SHA256SUMS
      - name: Publish tagged snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNAPSHOT_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$SNAPSHOT_TAG" snapshot/*
          --verify-tag --title "$SNAPSHOT_TAG"
          --notes "Verified static DLF Forum 2024 archive. Check SHA256SUMS before extracting; see snapshot.json for source revision, domain, URL prefix, and file checksums."
